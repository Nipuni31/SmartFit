spring.application.name=user-service

server.port=8081

# Use MongoDB as the primary datastore
spring.data.mongodb.uri=mongodb://localhost:27017/smartfitdb
spring.data.mongodb.database=smartfitdb

# (Optional) H2 settings kept for reference — commented out
# spring.datasource.url=jdbc:h2:mem:testdb
# spring.datasource.driverClassName=org.h2.Driver
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# spring.jpa.hibernate.ddl-auto=update
# spring.h2.console.enabled=true

# JWT Configuration
jwt.secret=secret-key-smartfit-secure-key-2024-production
jwt.expiration=86400000

# Logging
logging.level.root=INFO
logging.level.com.smartfit=DEBUG
logging.level.org.springframework.security=DEBUG

