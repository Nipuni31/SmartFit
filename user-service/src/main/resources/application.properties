spring.application.name=user-service

server.port=8081

# H2 Database Configuration (Current)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# MongoDB Configuration (For future migration)
# Uncomment the following to switch to MongoDB
# spring.data.mongodb.uri=mongodb://localhost:27017/smartfit-users
# spring.data.mongodb.database=smartfit-users

# JWT Configuration
jwt.secret=secret-key-smartfit-secure-key-2024-production
jwt.expiration=86400000

# Logging
logging.level.root=INFO
logging.level.com.smartfit=DEBUG
logging.level.org.springframework.security=DEBUG

