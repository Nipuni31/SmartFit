# SmartFit - Spring Boot Configuration for MongoDB

# Spring Boot MongoDB Configuration
# Copy this to application.properties when ready to migrate from H2 to MongoDB

# Database Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/smartfit-users
spring.data.mongodb.database=smartfit-users
spring.data.mongodb.auto-index-creation=true

# Connection Pool Settings
spring.data.mongodb.connection-string=mongodb://localhost:27017/smartfit-users?retryWrites=true&w=majority

# For MongoDB Atlas (Cloud)
# spring.data.mongodb.uri=mongodb+srv://<username>:<password>@<cluster>.mongodb.net/smartfit-users?retryWrites=true&w=majority

# Application Configuration
spring.application.name=user-service
server.port=8081

# JWT Configuration
jwt.secret=secret-key-smartfit-secure-key-2024-production
jwt.expiration=86400000

# Logging
logging.level.root=INFO
logging.level.com.smartfit=DEBUG
logging.level.org.springframework.data.mongodb=DEBUG

# Note: When switching to MongoDB:
# 1. Replace the H2 datasource configuration with MongoDB URI above
# 2. Update User entity: Change @Entity to @Document
# 3. Update UserRepository: Change extends JpaRepository to extends MongoRepository
# 4. Remove @Table and @Column annotations, use @Field instead
# 5. Update ID generation: @Id with @GeneratedValue not needed for MongoDB (ObjectId auto-generated)
